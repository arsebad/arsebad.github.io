<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<canvas></canvas>

<script >
    function InputManager(target = window) {

    this.target = target;

    this.events = {};

    this.state = {
        pointer: {
            down: false,
            dragging: false,
            startX: 0,
            startY: 0,
            x: 0,
            y: 0,
            dragX: 0,
            dragY: 0
        }
    };

    this.on = function (event, cb) {

        if (!this.events[event]) {
            this.events[event] = [];
        }

        this.events[event].push(cb);
    };

    this.emit = function (event, data) {

        if (!this.events[event]) return;

        for (const cb of this.events[event]) {
            cb(data);
        }
    };

    this.pointerDown = (e) => {

        const p = this.state.pointer;

        p.down = true;
        p.dragging = false;

        p.startX = e.clientX;
        p.startY = e.clientY;

        p.x = e.clientX;
        p.y = e.clientY;

        this.emit("press", p);
    };

    this.pointerMove = (e) => {

        const p = this.state.pointer;

        p.x = e.clientX;
        p.y = e.clientY;

        if (!p.down) return;

        p.dragging = true;

        p.dragX = p.x - p.startX;
        p.dragY = p.y - p.startY;

        this.emit("drag", p);
    };

    this.pointerUp = () => {

        const p = this.state.pointer;

        p.down = false;
        p.dragging = false;

        p.dragX = 0;
        p.dragY = 0;

        this.emit("release", p);
    };

    this.init = function () {

        this.target.addEventListener("pointerdown", this.pointerDown);
        this.target.addEventListener("pointermove", this.pointerMove);
        this.target.addEventListener("pointerup", this.pointerUp);
    };

    this.init();
}
</script>
<script>
    const actions = {
    move: { x: 0, y: 0 }
};
</script>
<script>
    function Player() {

    this.x = 100;
    this.y = 100;
    this.speed = 4;

    this.update = function (actions) {

        this.x += actions.move.x * this.speed;
        this.y += actions.move.y * this.speed;
    };

    this.draw = function (ctx) {

        ctx.fillStyle = "red";
        ctx.fillRect(this.x, this.y, 50, 50);
    };
}
</script>
<script>

function setupInput(input, actions) {

    input.on("drag", (p) => {

        actions.move.x = 0;
        actions.move.y = 0;

        const absX = Math.abs(p.dragX);
        const absY = Math.abs(p.dragY);

        if (absX > absY) {
            actions.move.x = p.dragX > 0 ? 1 : -1;
        } else {
            actions.move.y = p.dragY > 0 ? 1 : -1;
        }
    });

    input.on("release", () => {
        actions.move.x = 0;
        actions.move.y = 0;
    });
}

</script>
<script >

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const input = new InputManager(canvas);
setupInput(input, actions);

const player = new Player();

function loop() {

    player.update(actions);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    player.draw(ctx);

    requestAnimationFrame(loop);
}

loop();

</script>

<script>
    const canvas = document.querySelector("canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
</script>

</body>
</html>
