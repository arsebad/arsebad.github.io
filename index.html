<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <div id="game">
          <div id="world">
            <div id="fondo"></div>
            <div id="player"></div>
            <div id="npc"></div>
        </div>
    </div>
  

<script>


    const mundo = document.getElementById("world");

    const player = document.getElementById("player");

    const npc = document.getElementById("npc")

    let xplayer = 400;
    let yplayer = 300;

    let xcamera = 0;
    let ycamera = 0;

    let xnpc = 880;
    let ynpc = 855;

    let estadoPlayer = 0;

    
    let currentFrame = 0;
    let lastUpdate = 0;


const teclas = {
    ArrowLeft: false,
    ArrowDown: false,
    ArrowUp: false,
    ArrowRight: false,

};

const keys = {
    KeyZ: false,
    KeyX: false
}

    const velocidad = 5

    const margen = 200


</script>
<script src="movimiento/pointerload.js"> //pointerload </script>
<script src="movimiento/keyload.js"> //keyload</script> 
<script src="movimiento/controller.js">  // controller</script>
<script src="colision/cotrollCollision.js"> //colision</script>


<script src="animacion/samurai.js">//animacion jugador</script>
<script src="animacion/estado.js">//Estado</script>
<script src="animacion/acciones.js">//acciones</script>




<script>
function mover(time){

    moverteclado();
    movertactil();


        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const worldwidth = mundo.offsetWidth;
        const worldheight = mundo.offsetHeight;




 
        if(xplayer < 0) xplayer = 0;
        if(yplayer < 0) yplayer = 0;

        if(xplayer > worldwidth) xplayer = worldwidth;
        if(yplayer > worldheight) yplayer = worldheight;

        


        if (xplayer - xcamera > screenWidth - margen) {
            xcamera = xplayer - (screenWidth - margen);
        }

        if (xplayer - xcamera < margen) {
            xcamera = xplayer - margen;
        }

        if (yplayer - ycamera > screenHeight - margen) {
            ycamera = yplayer - (screenHeight - margen);
        }

        if (yplayer - ycamera < margen) {
            ycamera = yplayer - margen;
        }
        

        xcamera = Math.max(0, xcamera);
        ycamera = Math.max(0, ycamera);


        xcamera = Math.min(
            xcamera,
            worldwidth - screenWidth
        );

        ycamera = Math.min(
            ycamera,
            worldheight - screenHeight
        );



        

        player.style.left = xplayer + "px";
        player.style.top = yplayer + "px";

        mundo.style.left = -xcamera + "px";
        mundo.style.top = -ycamera + "px";

        npc.style.left = xnpc + "px";
        npc.style.top = ynpc + "px";

        actualizarEstado();
        actualizarAccion(estadoPlayer, time);

        if (getCollisionInfo(xplayer, yplayer, player.offsetWidth, player.offsetHeight, xnpc, ynpc, npc.offsetWidth, npc.offsetHeight)){
        let newposition = resolveCollision(xplayer, yplayer, player.offsetWidth, player.offsetHeight, xnpc, ynpc, npc.offsetWidth, npc.offsetHeight);
            xplayer = newposition.x;
            yplayer = newposition.y;
        } 
        


        requestAnimationFrame(mover);
    
}
    mover();
    
</script>


</body>
</html>
