const teclas = {

<script>
function mover(){

    moverteclado();
    movertactil();

        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const worldwidth = mundo.offsetWidth;
        const worldheight = mundo.offsetHeight;
 
        if(xplayer < 0) xplayer = 0;
        if(yplayer < 0) yplayer = 0;

        if(xplayer > worldwidth) xplayer = worldwidth;
        if(yplayer > worldheight) yplayer = worldheight;

        


        if (xplayer - xcamera > screenWidth - margen) {
            xcamera = xplayer - (screenWidth - margen);
        }

        if (xplayer - xcamera < margen) {
            xcamera = xplayer - margen;
        }

        if (yplayer - ycamera > screenHeight - margen) {
            ycamera = yplayer - (screenHeight - margen);
        }

        if (yplayer - ycamera < margen) {
            ycamera = yplayer - margen;
        }
        

        xcamera = Math.max(0, xcamera);
        ycamera = Math.max(0, ycamera);


        xcamera = Math.min(
            xcamera,
            worldwidth - screenWidth
        );

        ycamera = Math.min(
            ycamera,
            worldheight - screenHeight
        );

        

        cuadrado.style.left = xplayer + "px";
        cuadrado.style.top = yplayer + "px";

        mundo.style.left = -xcamera + "px";
        mundo.style.top = -ycamera + "px";

        npc.style.left = xnpc + "px";
        npc.style.top = ynpc + "px";



        
        
       /* checkCollision(
            { x: xplayer, y: yplayer, w: cuadrado.offsetWidth, h: cuadrado.offsetHeight },
            { x: xnpc, y: ynpc, w: npc.offsetWidth, h: npc.offsetHeight }
        );

        if (collisionState.isColliding) {
            cuadrado.style.display = "none";
            return;
        }*/

        requestAnimationFrame(mover);
    
}
    mover();
